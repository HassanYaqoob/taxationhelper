# Runs the whole stack: SQL Server 2022, the .NET API and the Angular app behind nginx.
#   cp .env.example .env   (then edit the values)
#   docker compose up -d --build
# App: http://localhost:8080    API + docs (when EXPOSE_API_DOCS=true): http://localhost:5080/scalar
name: kira

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
      MSSQL_PID: ${SQL_EDITION:-Developer}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: src/Kira.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Production}
      ConnectionStrings__Kira: "Server=db,1433;Database=${SQL_DATABASE:-Kira};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (at least 32 characters)}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Anthropic__Model: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      Seed__Demo: ${SEED_DEMO:-false}
      Database__AutoMigrate: "true"
      Auth__SecureCookies: ${SECURE_COOKIES:-false}
      App__ExposeApiDocs: ${EXPOSE_API_DOCS:-false}
    ports:
      - "${API_PORT:-5080}:8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  sqldata:
